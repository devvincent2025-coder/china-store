services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit
    # Runs Vite's dev server as its own long-lived container process, so `docker compose up` alone
    # gives you hot-reload with no separate `sail npm run dev` step to remember. This also fixes the
    # classic "blank page" footgun: public/hot (which tells Laravel to load assets from the Vite dev
    # server instead of the built /public/build files) is created and removed by Vite itself as this
    # container starts/stops — if you'd started Vite by hand and its process died without cleaning up
    # (e.g. a terminal closing, a Docker restart), Laravel kept pointing at a dead server and the app
    # loaded nothing. Tying it to the container lifecycle makes that far less likely to happen, since
    # `docker compose down`/a container stop sends SIGTERM, which Vite handles by cleaning up on exit.
    vite:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        # `exec` replaces the shell with the vite process as PID 1 — without it, `docker compose
        # down`'s SIGTERM stops at the shell wrapper instead of reaching Vite itself, so its cleanup
        # hook (the one that deletes public/hot on exit) never runs, leaving the exact stale-file
        # footgun this whole service exists to prevent. `npm run dev` / `npx vite` were both tried
        # and rejected here: each spawns vite as a grandchild through its own extra process layer
        # (verified via `docker exec ... ps aux` — SIGTERM sent to PID 1 never reached the actual
        # node process 2-3 levels down), so `exec`-ing the local binary directly is required to make
        # vite itself PID 1 and receive the signal.
        command: sh -c "[ -d node_modules ] || npm install; exec node_modules/.bin/vite --host=0.0.0.0"
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            # See vite.config.js's own comment on `devHost` — set VITE_DEV_HOST in .env to your
            # machine's LAN IP to load the dev server (and hot-reload) from a phone or other device
            # on the same network; defaults to localhost-only otherwise.
            VITE_DEV_HOST: '${VITE_DEV_HOST:-localhost}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
    # Runs the queue worker as its own long-lived container process. Every notification that emails
    # a buyer/vendor (order confirmations, payment success/failure, etc.) implements ShouldQueue, so
    # without a worker actually consuming the `jobs` table, they just pile up forever and nothing
    # ever gets sent — no email, no in-app bell notification, no webpush — even though the request
    # that queued them succeeded. `--tries=3` lets a transient failure (e.g. a flaky SMTP connection)
    # retry a couple of times before landing in `failed_jobs` instead of vanishing silently.
    queue:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        command: php artisan queue:listen --tries=3
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
